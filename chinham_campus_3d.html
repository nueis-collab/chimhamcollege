const COL=[],CIR=[{x:0,z:0,r:5.3}];
B.forEach(b=>{const q=Math.abs(Math.sin(b.rot))>.5;COL.push({x:b.x,z:b.z,hx:(q?b.d:b.w)*K/2+.35,hz:(q?b.w:b.d)*K/2+.35});});
COL.push({x:-7.2,z:30,hx:.45,hz:.45},{x:7.2,z:30,hx:.45,hz:.45},{x:0,z:21,hx:8.3,hz:.6});
TREES.forEach(([x,z])=>CIR.push({x,z,r:.5}));
const PR=.45;
function blocked(x,z){
  for(const c of COL)if(Math.abs(x-c.x)<c.hx+PR&&Math.abs(z-c.z)<c.hz+PR)return true;
  for(const c of CIR){const dx=x-c.x,dz=z-c.z,rr=c.r+PR;if(dx*dx+dz*dz<rr*rr)return true;}
  return false;}
const person=new THREE.Group();person.visible=false;root.add(person);
{const m=(g,c,x,y,z)=>mk(person,g,c,x,y,z);
 m(new THREE.CylinderGeometry(.13,.13,.8,10),0x333b4a,-.12,.4,0);m(new THREE.CylinderGeometry(.13,.13,.8,10),0x333b4a,.12,.4,0);
 m(new THREE.CylinderGeometry(.27,.22,.75,12),0x3d6fb5,0,1.17,0);
 m(new THREE.CylinderGeometry(.08,.08,.7,8),0x3d6fb5,-.36,1.15,0);m(new THREE.CylinderGeometry(.08,.08,.7,8),0x3d6fb5,.36,1.15,0);
 m(new THREE.SphereGeometry(.2,16,12),0xf0c8a0,0,1.7,0);m(new THREE.SphereGeometry(.21,16,12,0,6.3,0,1.4),0x2b2b2b,0,1.73,0);
 const rg=new THREE.Mesh(new THREE.RingGeometry(.7,.95,24),new THREE.MeshBasicMaterial({color:0xffd54a,side:THREE.DoubleSide}));rg.rotation.x=-Math.PI/2;rg.position.y=.12;person.add(rg);}
const keys=new Set();
addEventListener('keydown',e=>{keys.add(e.code);if(mode==='fp'&&e.code.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jv={x:0,y:0},jid=null;
function jmove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),R0=r.width/2-10;if(m>R0){dx*=R0/m;dy*=R0/m;}knob.style.transform='translate('+dx+'px,'+dy+'px)';jv.x=dx/R0;jv.y=dy/R0;}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);jmove(e);e.stopPropagation();});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e);});
const jend=e=>{if(e.pointerId===jid){jid=null;jv.x=jv.y=0;knob.style.transform='';}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
let warnT=0;
function warn(){const w=document.getElementById('warn');w.style.display='block';clearTimeout(warnT);warnT=setTimeout(()=>w.style.display='none',3000);}
function stepFP(dt){
  let f=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-jv.y;
  let r=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+jv.x;
  const m=Math.hypot(f,r);if(m>1){f/=m;r/=m;}
  const sp=4*dt,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  const dx=(-sy*f+cy*r)*sp,dz=(-cy*f-sy*r)*sp;
  if(!blocked(player.x+dx,player.z))player.x+=dx;
  if(!blocked(player.x,player.z+dz))player.z+=dz;
  if(player.x<LB.x0||player.x>LB.x1||player.z<LB.z0||player.z>LB.z1){warn();Object.assign(player,START);}
  cam.position.set(player.x*S,1.7*S,player.z*S);cam.rotation.set(player.pitch,player.yaw,0,'YXZ');
}
function tpView(){const tg=new THREE.Vector3(player.x*S,1.2*S,player.z*S),f=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  view(tg.clone().addScaledVector(f,-.7071*40).add(new THREE.Vector3(0,.7071*40,0)),tg);}
const HINT_FP='1인칭 · PC: WASD/방향키 이동 · 마우스 드래그로 시선<br>모바일: 왼쪽 조이스틱으로 이동 · 화면 드래그로 시선<br>활동 범위를 벗어나면 처음 위치로 돌아와요';
const HINT_TP='3인칭 · 건물을 터치/클릭하면 내부가 보여요<br>PC: 드래그 회전 · 휠 확대 · 우클릭 드래그 이동<br>모바일: 한 손가락 회전 · 두 손가락으로 이동 · 확대/축소';
function setMode(m){
  if(active){exit(true);document.getElementById('bar').style.display='none';}
  mode=m;tw=null;tip.style.display='none';if(hov){hl(hov,0);hov=null;}
  const fp=m==='fp';controls.enabled=!fp;person.visible=!fp;joy.style.display=fp&&isTouch?'block':'none';
  cam.fov=fp?70:50;cam.updateProjectionMatrix();
  document.getElementById('mode').textContent=fp?'3인칭으로 보기':'1인칭으로 걷기';
  const h=document.getElementById('hint');h.style.display='';h.innerHTML=fp?HINT_FP:HINT_TP;
  if(fp){stepFP(0);}
  else{person.position.set(player.x,0,player.z);person.rotation.y=player.yaw;tpView();}
}
document.getElementById('mode').onclick=()=>setMode(mode==='fp'?'tp':'fp');

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2(),tip=document.getElementById('tip');
function pick(e){mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);
  const h=ray.intersectObjects(B.filter(b=>b.shell.visible).map(b=>b.shell),true)[0];if(!h)return null;
  let o=h.object;while(o&&!o.userData.b)o=o.parent;return o?o.userData.b:null;}
let hov=null,down=null,look=null;
R.domElement.addEventListener('pointermove',e=>{if(mode==='fp'){if(look&&look.id===e.pointerId){player.yaw-=(e.clientX-look.x)*.004;player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch-(e.clientY-look.y)*.004));look.x=e.clientX;look.y=e.clientY;}return;}
  const b=pick(e);if(b!==hov){if(hov)hl(hov,0);hov=b;if(b)hl(b,0x333333);}
  R.domElement.style.cursor=b?'pointer':'';
  if(b){tip.style.display='block';tip.textContent=b.name;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';}else tip.style.display='none';});
R.domElement.addEventListener('pointerdown',e=>{if(mode==='fp'){look={id:e.pointerId,x:e.clientX,y:e.clientY};return;}down=[e.clientX,e.clientY];});
R.domElement.addEventListener('pointerup',e=>{if(mode==='fp'){look=null;return;}if(!down)return;const m=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(m>6)return;const b=pick(e);if(b&&b!==active)enter(b);});

setMode('fp');
/* ---------- loop ---------- */
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
R.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(tw){tw.k=Math.min(1,tw.k+dt/.9);const e=tw.k*tw.k*(3-2*tw.k);cam.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.t0,tw.t1,e);if(tw.k>=1)tw=null;}
  if(mode==='fp')stepFP(dt);else{const g=controls.target;g.x=Math.max(LB.x0*S,Math.min(LB.x1*S,g.x));g.z=Math.max(LB.z0*S,Math.min(LB.z1*S,g.z));if(cam.position.y<.5)cam.position.y=.5;controls.update();}R.render(scene,cam);
});
